<style id="leaflet-css">
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

  display:none;align-items:center;gap:6px;
  background:var(--gold-light);color:var(--maroon-dark);
  font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;
  flex-shrink:0;
}
.admin-pill.show{display:inline-flex;}

/* ---------- Sidebar ---------- */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(43,35,32,.45);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  z-index:45;
}
.sidebar-overlay.show{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;bottom:0;left:0;
  width:var(--sidebar-w);max-width:86vw;
  background:var(--white);
  box-shadow:var(--shadow);
  transform:translateX(-105%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:50;
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.sidebar.open{transform:translateX(0);}
html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(105%);}
html[dir="rtl"] .sidebar.open{transform:translateX(0);}

.sidebar-header{
  padding:28px 22px 18px;
  background:linear-gradient(160deg,var(--maroon) 0%,var(--maroon-dark) 100%);
  color:var(--white);
  display:flex;align-items:center;gap:14px;
}
.sidebar-header img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
.sidebar-header-text .bw{font-size:19px;font-weight:800;letter-spacing:.3px;}
.sidebar-header-text .bt{font-size:12px;color:var(--gold-light);margin-top:3px;line-height:1.35;}

.sidebar-nav{list-style:none;margin:0;padding:14px 12px;flex:1;}
.sidebar-nav li{margin-bottom:4px;}
.nav-link{
  display:flex;align-items:center;gap:13px;
  padding:12px 14px;border-radius:12px;
  color:var(--ink);text-decoration:none;
  font-weight:600;font-size:15px;
  border:none;background:none;width:100%;text-align:start;
  transition:background .15s ease,color .15s ease;
}
.nav-link svg{width:20px;height:20px;flex-shrink:0;stroke:var(--maroon);}
.nav-link:hover{background:var(--off-white);}
.nav-link.active{background:var(--maroon);color:var(--white);}
.nav-link.active svg{stroke:var(--white);}
.nav-divider{height:1px;background:var(--border);margin:10px 14px;}
.nav-badge{
  margin-inline-start:auto;background:var(--gold);color:var(--maroon-dark);
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
}
.nav-count{
  margin-inline-start:auto;background:var(--maroon);color:var(--white);
  font-size:11px;font-weight:800;min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;display:flex;align-items:center;justify-content:center;
}
.nav-link.active .nav-count{background:var(--white);color:var(--maroon);}
.sidebar-footer{padding:16px 22px 22px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);}

/* ---------- Main content ---------- */
.main-content{padding-top:var(--topbar-h);min-height:100vh;}
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.container{max-width:1080px;margin:0 auto;padding:28px 20px 70px;}
.page-header{margin-bottom:24px;}
.page-header h1{font-size:26px;margin:0 0 6px;color:var(--maroon-dark);}
.page-header p{margin:0;color:var(--muted);font-size:14.5px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:12px;padding:12px 22px;font-weight:700;font-size:14.5px;
  border:2px solid transparent;transition:transform .1s ease,box-shadow .15s ease,background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;}
.btn-primary{background:var(--maroon);color:var(--white);}
.btn-primary:hover{background:var(--maroon-dark);box-shadow:var(--shadow-sm);}
.btn-gold{background:var(--gold);color:var(--maroon-dark);}
.btn-gold:hover{background:var(--gold-light);box-shadow:var(--shadow-sm);}
.btn-outline{background:transparent;border-color:var(--maroon);color:var(--maroon);}
.btn-outline:hover{background:var(--maroon);color:var(--white);}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border);}
.btn-ghost:hover{background:var(--off-white);}
.btn-danger{background:#fff;color:#b3261e;border-color:#f3c9c6;}
.btn-danger:hover{background:#fdecea;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;}
.btn-fab{
  position:fixed;bottom:22px;inset-inline-end:22px;
  width:56px;height:56px;border-radius:50%;
  background:var(--maroon);color:var(--white);border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(122,28,43,.35);z-index:20;
}
.btn-fab svg{width:26px;height:26px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--white);
  padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  z-index:300;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#7a1620;}

/* ---------- Spinner ---------- */
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--maroon);
  animation:spin .7s linear infinite;margin:40px auto;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-row{display:flex;justify-content:center;padding:30px 0;grid-column:1/-1;}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(155deg,var(--maroon) 0%,var(--maroon-dark) 65%);
  color:var(--white);
  border-radius:0 0 32px 32px;
  padding:44px 20px 60px;
  margin-bottom:8px;
}
.hero::before,.hero::after{
  content:"";position:absolute;border-radius:50%;
  background:var(--gold);opacity:.14;
}
.hero::before{width:260px;height:260px;top:-90px;inset-inline-end:-70px;}
.hero::after{width:180px;height:180px;bottom:-70px;inset-inline-start:-50px;background:var(--white);opacity:.08;}
.hero-inner{position:relative;max-width:760px;margin:0 auto;text-align:center;}
.hero-logo{width:96px;height:96px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));}
.hero h1{font-size:30px;line-height:1.3;margin:0 0 14px;}
.hero p{font-size:15.5px;line-height:1.7;color:#f3dfe2;margin:0 0 26px;}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

.home-section{max-width:900px;margin:0 auto;padding:40px 20px 0;}
.home-section h2{font-size:22px;color:var(--maroon-dark);text-align:center;margin:0 0 30px;}
.reasons-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.reason-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 20px;text-align:center;box-shadow:var(--shadow-sm);
}
.reason-icon{
  width:54px;height:54px;border-radius:16px;margin:0 auto 14px;
  background:linear-gradient(155deg,var(--gold) 0%,var(--gold-light) 100%);
  display:flex;align-items:center;justify-content:center;
}
.reason-icon svg{width:26px;height:26px;stroke:var(--maroon-dark);}
.reason-card h3{font-size:16px;margin:0 0 8px;color:var(--ink);}
.reason-card p{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0;}

.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:step;}
.how-card{position:relative;padding:22px 18px;text-align:center;}
.how-num{
  width:40px;height:40px;border-radius:50%;background:var(--maroon);color:var(--white);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  margin:0 auto 12px;
}
.how-card h3{font-size:15px;margin:0 0 6px;color:var(--ink);}
.how-card p{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0;}

@media(max-width:760px){
  .reasons-grid,.how-grid{grid-template-columns:1fr;}
  .hero h1{font-size:24px;}
}

/* ---------- Nested category tabs (Clothes) ---------- */
.group-tabs{
  display:flex;gap:6px;background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:5px;margin-bottom:16px;overflow-x:auto;
}
.group-tab{
  flex:1;min-width:max-content;padding:10px 16px;border-radius:10px;border:none;
  background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;
  white-space:nowrap;transition:all .15s ease;
}
.group-tab.active{background:var(--maroon);color:var(--white);}
.group-tab:hover:not(.active){background:var(--off-white);color:var(--ink);}

.subfilter-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 8px;}

/* ---------- Filters / Grid / Cards ---------- */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin;}
.filter-chip{
  flex-shrink:0;padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--white);color:var(--ink);font-weight:600;font-size:13px;
  white-space:nowrap;transition:all .15s ease;
}
.filter-chip.active{background:var(--maroon);border-color:var(--maroon);color:var(--white);}
.filter-chip:hover:not(.active){border-color:var(--maroon-light);}

.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.item-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease;
  display:flex;flex-direction:column;position:relative;
}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.item-card-photo{width:100%;aspect-ratio:1/1;background:var(--off-white);position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);}
.item-card-photo img{width:100%;height:100%;object-fit:cover;}
.item-card-photo .no-photo{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.item-card-photo .no-photo svg{width:34px;height:34px;stroke:var(--border);}
.stock-flag{
  position:absolute;top:8px;inset-inline-end:8px;background:rgba(43,35,32,.78);color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
}
.stock-flag.out{background:#b3261e;}
.item-card-body{padding:14px 16px 16px;}
.item-card-title{font-weight:700;font-size:14.5px;margin:0 0 8px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.item-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge{
  display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:999px;
}
.badge-size{background:var(--off-white);color:var(--maroon-dark);border:1px solid var(--border);}
.badge-gold{background:var(--gold-light);color:var(--maroon-dark);}
.badge-green{background:#e4f5e9;color:#1c7a3f;}
.badge-red{background:#fdecea;color:#b3261e;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;
}
.empty-state svg{width:48px;height:48px;stroke:var(--border);margin-bottom:14px;}
.empty-state p{font-size:14.5px;margin:0;}

.section-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}

@media(max-width:900px){.item-grid{grid-template-columns:repeat(2,1fr);gap:14px;}}
@media(max-width:480px){.item-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .item-card-body{padding:10px 12px 12px;}.item-card-title{font-size:13px;}}

/* ---------- Modals ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,35,32,.55);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  z-index:100;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--white);border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  padding:26px 22px 28px;
  transform:translateY(30px);transition:transform .25s ease;
}
.modal-overlay.show .modal-box{transform:translateY(0);}
@media(min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:22px;transform:scale(.96) translateY(10px);}
  .modal-overlay.show .modal-box{transform:scale(1) translateY(0);}
}
.modal-box.modal-wide{max-width:680px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;}
.modal-header h2{font-size:19px;margin:0;color:var(--maroon-dark);}
.modal-close{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--off-white);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);
}
.modal-close svg{width:17px;height:17px;}
.modal-close:hover{background:var(--border);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;color:var(--ink);}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=number],
.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--off-white);color:var(--ink);outline:none;transition:border-color .15s ease;
}
.field textarea{resize:vertical;min-height:80px;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--maroon);background:var(--white);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.two-col{grid-template-columns:1fr;}}

.size-chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.size-chip{
  padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--off-white);font-weight:700;font-size:13px;color:var(--ink);
}
.size-chip.active{background:var(--maroon);border-color:var(--maroon);color:var(--white);}

/* ---------- Stock stepper ---------- */
.stock-stepper{display:flex;align-items:center;gap:14px;}
.stepper-btn{
  width:42px;height:42px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--off-white);color:var(--maroon);font-weight:800;font-size:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;
}
.stepper-btn:hover{background:var(--maroon);color:var(--white);border-color:var(--maroon);}
.stepper-value{font-size:20px;font-weight:800;min-width:38px;text-align:center;color:var(--ink);}

.file-drop{
  border:2px dashed var(--border);border-radius:14px;padding:22px 14px;text-align:center;
  background:var(--off-white);position:relative;cursor:pointer;
}
.file-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-drop svg{width:30px;height:30px;stroke:var(--maroon-light);margin-bottom:8px;}
.file-drop p{margin:0;font-size:13px;color:var(--muted);font-weight:600;}
.photo-preview-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb button{
  position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;
}
.photo-thumb button svg{width:11px;height:11px;}
.photo-thumb.uploading::after{
  content:"";position:absolute;inset:0;background:rgba(255,255,255,.6);
  border:2px solid var(--maroon);border-top-color:transparent;border-radius:50%;
  width:20px;height:20px;margin:auto;animation:spin .7s linear infinite;
}

.modal-actions{display:flex;gap:10px;margin-top:22px;}
.modal-actions .btn{flex:1;}

/* ---------- Detail modal gallery + lightbox ---------- */
.detail-gallery{border-radius:14px;overflow:hidden;background:var(--off-white);margin-bottom:16px;}
.detail-main-photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--off-white);cursor:zoom-in;}
.detail-thumbs{display:flex;gap:8px;padding:8px;overflow-x:auto;}
.detail-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;border:2px solid transparent;opacity:.7;}
.detail-thumbs img.active{border-color:var(--maroon);opacity:1;}
.detail-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
.detail-row:last-of-type{border-bottom:none;}
.detail-row .dk{color:var(--muted);font-weight:600;flex-shrink:0;}
.detail-row .dv{color:var(--ink);font-weight:600;text-align:end;}

.lightbox{
  position:fixed;inset:0;background:rgba(10,7,6,.94);z-index:400;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.lightbox.show{opacity:1;pointer-events:auto;}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px;}
.lightbox-close{
  position:absolute;top:18px;inset-inline-end:18px;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;
}
.lightbox-close svg{width:20px;height:20px;}

/* ---------- Reserve button + reservation modal ---------- */
.reserve-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;
  padding-top:18px;border-top:1px solid var(--border);}
.reserve-stock-label{font-size:13px;font-weight:700;color:var(--muted);}
.reserve-stock-label.in{color:#1c7a3f;}
.reserve-stock-label.out{color:#b3261e;}

.map-wrap{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);margin-bottom:10px;}
#reserveMap{height:220px;width:100%;background:var(--off-white);}
.map-hint{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
.locate-btn{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin-bottom:14px;}
.locate-btn svg{width:16px;height:16px;}

/* ---------- Reservations admin list ---------- */
.reservation-card{
  background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;
  cursor:pointer;transition:box-shadow .15s ease;
}
.reservation-card:hover{box-shadow:var(--shadow-sm);}
.reservation-card.fulfilled{opacity:.6;}
.res-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:flex-start;}
.res-top .name{font-weight:800;font-size:14.5px;}
.res-top .date{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.res-item-label{font-size:13px;color:var(--maroon-dark);font-weight:700;margin:2px 0 6px;}
.res-sub{font-size:12.5px;color:var(--muted);}
.status-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;}
.status-pill.pending{background:var(--gold-light);color:var(--maroon-dark);}
.status-pill.fulfilled{background:#e4f5e9;color:#1c7a3f;}
.status-pill.cancelled{background:#f1f1f1;color:#888;}

/* ---------- About page ---------- */
.about-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow-sm);}
.about-body p{line-height:1.85;font-size:15px;color:var(--ink);margin:0 0 16px;}
.about-body p:last-child{margin-bottom:0;}
.about-credits{margin-top:22px;padding-top:20px;border-top:1px solid var(--border);}
.about-credits h3{font-size:14px;color:var(--maroon-dark);margin:0 0 8px;}
.about-credits p{font-size:13px;color:var(--muted);line-height:1.7;margin:0;}
.about-edit-bar{display:flex;justify-content:flex-end;margin-bottom:14px;}
.about-textarea{width:100%;min-height:220px;padding:16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--off-white);line-height:1.8;font-size:14.5px;color:var(--ink);}

/* ---------- Donate page ---------- */
.donate-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px;}
.donate-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);}
.donate-card-icon{
  width:48px;height:48px;border-radius:14px;background:linear-gradient(155deg,var(--maroon) 0%,var(--maroon-light) 100%);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;
}
.donate-card-icon svg{width:24px;height:24px;stroke:var(--white);}
.donate-card h3{font-size:16.5px;margin:0 0 8px;color:var(--ink);}
.donate-card p{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 16px;}
.phone-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.phone-number{font-size:17px;font-weight:800;color:var(--maroon-dark);letter-spacing:.5px;}
.inbox-item{
  background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;
}
.inbox-item.reviewed{opacity:.6;}
.inbox-item-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;}
.inbox-item-top .name{font-weight:800;font-size:14.5px;}
.inbox-item-top .date{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.inbox-item p{font-size:13.5px;margin:3px 0;color:var(--ink);}
.inbox-item .lbl{color:var(--muted);font-weight:600;}
.inbox-actions{display:flex;gap:8px;margin-top:12px;}

@media(max-width:720px){.donate-grid{grid-template-columns:1fr;}}

/* ---------- Login page/modal ---------- */
.login-box{max-width:380px;margin:60px auto;text-align:center;padding:0 20px;}
.login-box .li{
  width:64px;height:64px;border-radius:18px;background:var(--maroon);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
}
.login-box .li svg{width:30px;height:30px;stroke:var(--white);}
.login-box h1{font-size:21px;margin:0 0 8px;color:var(--maroon-dark);}
.login-box p{font-size:13.5px;color:var(--muted);margin:0 0 24px;line-height:1.6;}
.login-box .field{text-align:start;}
.error-text{color:#b3261e;font-size:13px;font-weight:600;margin-top:10px;display:none;}
.error-text.show{display:block;}
.logged-in-box{max-width:380px;margin:60px auto;text-align:center;padding:0 20px;}
.logged-in-box .li{background:#1c7a3f;}

/* ---------- Settings page ---------- */
.lang-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--white);margin-bottom:12px;
}
.lang-option.active{border-color:var(--maroon);background:#fdf3f4;}
.lang-option-name{font-weight:700;font-size:15px;}
.lang-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
.lang-option.active .lang-check{border-color:var(--maroon);background:var(--maroon);}
.lang-option.active .lang-check::after{
  content:"";position:absolute;inset:5px;background:var(--white);border-radius:50%;
}

.admin-only{display:none;}
.admin-only.show{display:block;}
.admin-only.show-flex{display:flex;}
</style>
</head>

/* ---------- Small utilities ---------- */
function escapeHTML(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(currentLang==="en" ? "en-US" : (currentLang==="ar" ? "ar" : "en-GB"));
  }catch(e){ return ""; }
}
function formatAgeBand(band){
  const m = /^(\d+)-(\d+)(m|y)$/.exec(band || "");
  if(!m) return band || "";
  const unit = m[3]==="m" ? t("age_unit_months") : t("age_unit_years");
  return m[1]+"-"+m[2]+" "+unit;
}
function typeLabel(key){
  const found = CLOTHING_TYPES.find(c=>c.key===key);
  return found ? t(found.labelKey) : key;
}
function groupLabel(key){
  const found = CATEGORY_GROUPS.find(g=>g.key===key);
  return found ? t(found.labelKey) : key;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg, isError){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2800);
}
function friendlyError(err){
  const msg = (err && err.message) || String(err || "");
  if(msg.includes("invalid admin passphrase")) return t("error_login_required");
  return t("error_generic");
}

/* ---------- storage (guarded: opening this file directly as file://, instead of
   hosting it, can make the browser throw just from TOUCHING localStorage /
   sessionStorage — even the property access itself, not only .getItem(). That
   throw happens as soon as the script runs, before anything else, which used to
   silently stop the whole page from working. Every access goes through here now,
   with the store itself looked up inside the try block. ) ---------- */
function storageGet(kind, key){
  try{
    const store = kind === "session" ? window.sessionStorage : window.localStorage;
    return store.getItem(key);
  }catch(e){ return null; }
}
function storageSet(kind, key, val){
  try{
    const store = kind === "session" ? window.sessionStorage : window.localStorage;
    store.setItem(key, val);
  }catch(e){ /* ignore: e.g. file:// or storage disabled */ }
}
function storageRemove(kind, key){
  try{
    const store = kind === "session" ? window.sessionStorage : window.localStorage;
    store.removeItem(key);
  }catch(e){ /* ignore */ }
}

  if(pass) storageSet("session", "rona_admin_pass", pass);

// Calls an admin_* RPC function, automatically passing the stored password
// as its first argument. If the server rejects it (wrong/rotated password),
// the admin session is cleared and the user is bounced to the login page.
async function adminCall(fnName, args){
  const { data, error } = await supabase.rpc(fnName, { p_passphrase: getAdminPass(), ...args });
  if(error){
    if(String(error.message||"").includes("invalid admin passphrase")){
      setAdminPass("");
      updateAdminUI();
      showPage("login");
    }
    throw error;
  }
  return data;
}

  document.querySelectorAll(".admin-only").forEach(el=>{

    if(wantsFlex) el.style.display = admin ? "flex" : "none";

  document.getElementById("navAdminBadge").style.display = admin ? "inline-flex" : "none";

/* ---------- Image compression + Supabase Storage upload ---------- */
function fileToCompressedBlob(file, maxDim, quality){
  maxDim = maxDim || 1100; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=> blob ? resolve(blob) : reject(new Error("compress failed")), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhotoBlob(blob, folderPrefix){
  const path = folderPrefix + "/" + uid() + ".jpg";
  const { error } = await supabase.storage.from(PHOTOS_BUCKET).upload(path, blob, {
    contentType: "image/jpeg", upsert: false
  });
  if(error) throw error;
  const { data } = supabase.storage.from(PHOTOS_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

/* Generic photo-picker wiring used by both add-item forms. Uploads happen
   as soon as a photo is picked, so by the time the form is submitted every
   URL is already known. */
function wirePhotoPicker(inputId, previewId, folderPrefix){
  const state = { photos: [] };   // uploaded public URLs, in order
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);

  input.addEventListener("change", async ()=>{
    const files = Array.from(input.files || []);
    input.value = "";
    for(const f of files){
      const thumb = document.createElement("div");
      thumb.className = "photo-thumb uploading";
      preview.appendChild(thumb);
      try{
        const blob = await fileToCompressedBlob(f);
        thumb.innerHTML = '<img src="'+URL.createObjectURL(blob)+'" alt="">' +
          '<button type="button" aria-label="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        const url = await uploadPhotoBlob(blob, folderPrefix);
        thumb.classList.remove("uploading");
        state.photos.push(url);
        thumb.querySelector("button").addEventListener("click", ()=>{
          state.photos = state.photos.filter(u=> u !== url);
          thumb.remove();
        });
      }catch(err){
        thumb.remove();
        showToast(friendlyError(err), true);
      }
    }
  });
  function reset(){ state.photos = []; preview.innerHTML = ""; }
  return { state, reset };
}

/* ---------- Shared item detail modal ---------- */
let currentDetail = { source: null, id: null };

function detailRow(label, value){
  return '<div class="detail-row"><span class="dk">'+escapeHTML(label)+'</span><span class="dv">'+escapeHTML(value)+'</span></div>';
}

function openDetail(source, id){
  const list = source === "clothes" ? cachedClothes : cachedExtra;
  const item = list.find(i=> i.id === id);
  if(!item) return;
  currentDetail = { source, id };

  document.getElementById("detailTitle").textContent = source==="clothes" ? typeLabel(item.type) : item.title;

  const photos = (item.photos && item.photos.length) ? item.photos : [];
  const mainPhoto = document.getElementById("detailMainPhoto");
  const thumbs = document.getElementById("detailThumbs");
  if(photos.length){
    mainPhoto.src = photos[0];
    mainPhoto.style.display = "block";
    mainPhoto.onclick = ()=> openLightbox(mainPhoto.src);
  }else{
    mainPhoto.removeAttribute("src");
    mainPhoto.style.display = "none";
    mainPhoto.onclick = null;
  }
  thumbs.innerHTML = "";
  if(photos.length > 1){
    photos.forEach((src, idx)=>{
      const th = document.createElement("img");
      th.src = src;
      if(idx===0) th.classList.add("active");
      th.addEventListener("click", ()=>{
        mainPhoto.src = src;
        thumbs.querySelectorAll("img").forEach(im=> im.classList.toggle("active", im===th));
      });
      thumbs.appendChild(th);
    });
  }

  let fieldsHTML = "";
  if(source === "clothes"){
    fieldsHTML += detailRow(t("group_label"), groupLabel(item.category_group));
    fieldsHTML += detailRow(t("age_label"), formatAgeBand(item.age_band));
    fieldsHTML += detailRow(t("detail_size"), item.size || t("not_specified"));
  }else if(item.size){
    fieldsHTML += detailRow(t("detail_size"), item.size);
  }
  fieldsHTML += detailRow(t("detail_listed_by"), item.listed_by || t("not_specified"));
  fieldsHTML += detailRow(t("detail_condition"), item.condition_notes || t("not_specified"));
  fieldsHTML += detailRow(t("detail_added_on"), fmtDate(item.created_at));
  if(isAdmin()){
    fieldsHTML += '<div class="detail-row"><span class="dk">'+escapeHTML(t("stock_label"))+'</span>' +
      '<span class="stock-stepper" style="gap:10px">' +
        '<button type="button" class="stepper-btn" id="detailStockMinus" style="width:32px;height:32px;font-size:16px">−</button>' +
        '<span class="stepper-value" id="detailStockValue" style="font-size:16px;min-width:26px">'+item.stock+'</span>' +
        '<button type="button" class="stepper-btn" id="detailStockPlus" style="width:32px;height:32px;font-size:16px">+</button>' +
      '</span></div>';
  }
  document.getElementById("detailFields").innerHTML = fieldsHTML;

  refreshDetailReserveBar(item);

  if(isAdmin()){
    document.getElementById("detailStockMinus").addEventListener("click", async ()=>{
      const v = await (source==="clothes" ? adjustClothesStock(item.id,-1) : adjustExtraStock(item.id,-1));
      if(v!==null){ item.stock=v; document.getElementById("detailStockValue").textContent=v; refreshDetailReserveBar(item); (source==="clothes"?renderClothesGrid:renderExtraGrid)(); }
    });
    document.getElementById("detailStockPlus").addEventListener("click", async ()=>{
      const v = await (source==="clothes" ? adjustClothesStock(item.id,1) : adjustExtraStock(item.id,1));
      if(v!==null){ item.stock=v; document.getElementById("detailStockValue").textContent=v; refreshDetailReserveBar(item); (source==="clothes"?renderClothesGrid:renderExtraGrid)(); }
    });
  }

  openModal("itemDetailModal");
}

function refreshDetailReserveBar(item){
  const label = document.getElementById("detailStockLabel");
  const btn = document.getElementById("detailReserveBtn");
  if(item.stock > 0){
    label.textContent = item.stock + " " + t("stock_left_one");
    label.className = "reserve-stock-label in";
    btn.disabled = false;
  }else{
    label.textContent = t("out_of_stock_label");
    label.className = "reserve-stock-label out";
    btn.disabled = true;
  }
}

document.getElementById("detailReserveBtn").addEventListener("click", ()=>{
  const { source, id } = currentDetail;
  const list = source === "clothes" ? cachedClothes : cachedExtra;
  const item = list.find(i=> i.id === id);
  if(!item) return;
  const label = source === "clothes"
    ? typeLabel(item.type) + " — " + groupLabel(item.category_group) + " — " + formatAgeBand(item.age_band)
    : item.title;
  openReserveModal(source, item.id, label);
});

document.getElementById("detailDeleteBtn").addEventListener("click", ()=>{
  if(!currentDetail.id) return;
  if(!confirm(t("confirm_delete"))) return;
  if(currentDetail.source === "clothes") deleteClothesItem(currentDetail.id);
  else deleteExtraItem(currentDetail.id);
});

/* ---------- Reservation flow (visitor-facing) ---------- */
let reserveMap = null, reserveMarker = null;
let reserveLat = null, reserveLng = null, reserveLocationNote = null;
let reserveContext = { source: null, itemId: null, label: null };
const ERBIL_CENTER = [36.191, 44.009];

function ensureReserveMap(){
  if(reserveMap) return;
  reserveMap = L.map("reserveMap", { zoomControl: true }).setView(ERBIL_CENTER, 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors", maxZoom: 19
  }).addTo(reserveMap);
  reserveMap.on("click", e=> setReserveMarker(e.latlng.lat, e.latlng.lng, "manual"));
}
function setReserveMarker(lat, lng, note){
  reserveLat = lat; reserveLng = lng; reserveLocationNote = note;
  if(reserveMarker) reserveMarker.setLatLng([lat,lng]);
  else reserveMarker = L.marker([lat,lng]).addTo(reserveMap);
  reserveMap.setView([lat,lng], 15);
}

function openReserveModal(source, itemId, label){
  reserveContext = { source, itemId, label };
  document.getElementById("reserveItemLabel").textContent = label;
  document.getElementById("reserveForm").reset();
  reserveLat = null; reserveLng = null; reserveLocationNote = null;
  if(reserveMarker && reserveMap){ reserveMap.removeLayer(reserveMarker); reserveMarker = null; }
  openModal("reserveModal");
  requestAnimationFrame(()=>{
    ensureReserveMap();
    reserveMap.setView(ERBIL_CENTER, 12);
    setTimeout(()=> reserveMap.invalidateSize(), 60);
  });
}

document.getElementById("locateMeBtn").addEventListener("click", ()=>{
  if(!navigator.geolocation){ showToast(t("error_generic"), true); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      ensureReserveMap();
      setReserveMarker(pos.coords.latitude, pos.coords.longitude, "shared live location");
      showToast(t("location_shared"));
    },
    ()=> showToast(t("error_generic"), true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

document.getElementById("reserveForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = document.getElementById("reserveSubmitBtn");
  btn.disabled = true;
  try{
    const { error } = await supabase.rpc("submit_reservation", {
      p_item_kind: reserveContext.source,
      p_item_id: reserveContext.itemId,
      p_item_label: reserveContext.label,
      p_name: document.getElementById("reserveName").value.trim(),
      p_phone: document.getElementById("reservePhone").value.trim(),
      p_street: document.getElementById("reserveStreet").value.trim() || null,
      p_area: document.getElementById("reserveArea").value.trim() || null,
      p_lat: reserveLat,
      p_lng: reserveLng,
      p_location_note: reserveLocationNote,
      p_notes: document.getElementById("reserveNotes").value.trim() || null
    });
    if(error) throw error;
    closeModal("reserveModal");
    closeModal("itemDetailModal");
    showToast(t("reserve_success_toast"));
  }catch(err){
    showToast(friendlyError(err), true);
  }finally{
    btn.disabled = false;
  }
});

/* ---------- Reservations (admin page) ---------- */
let cachedReservations = [];
let currentReservationId = null;
let reservationDetailMap = null, reservationDetailMarker = null;

async function loadReservations(){
  if(!isAdmin()) return;
  try{
    const data = await adminCall("admin_list_reservations", {});
    cachedReservations = data || [];
    renderReservationsCached();
    updateReservationsBadge();
  }catch(err){
    showToast(friendlyError(err), true);
  }
}
function renderReservationsCached(){
  if(!isAdmin()) return;
  const list = document.getElementById("reservationsList");
  const empty = document.getElementById("reservationsEmpty");
  if(!list) return;
  list.innerHTML = "";
  if(!cachedReservations.length){ empty.style.display = "block"; return; }
  empty.style.display = "none";
  cachedReservations.forEach(r=>{
    const card = document.createElement("div");
    card.className = "reservation-card" + (r.status==="fulfilled" ? " fulfilled" : "");
    card.innerHTML =
      '<div class="res-top"><span class="name">'+escapeHTML(r.name)+'</span>' +
      '<span class="status-pill '+r.status+'">'+escapeHTML(t("status_"+r.status))+'</span></div>' +
      '<p class="res-item-label">'+escapeHTML(r.item_label)+'</p>' +
      '<p class="res-sub">'+escapeHTML(r.phone)+(r.area ? " · "+escapeHTML(r.area) : "")+'</p>' +
      '<p class="res-sub">'+fmtDate(r.created_at)+'</p>';
    card.addEventListener("click", ()=> openReservationDetail(r.id));
    list.appendChild(card);
  });
}
function updateReservationsBadge(){
  const pending = cachedReservations.filter(r=> r.status==="pending").length;
  const badge = document.getElementById("reservationsCount");
  if(pending > 0){ badge.style.display = "flex"; badge.textContent = pending; }
  else badge.style.display = "none";
}

function openReservationDetail(id){
  const r = cachedReservations.find(x=> x.id===id);
  if(!r) return;
  currentReservationId = id;

  let html = "";
  html += detailRow(t("reserved_item_label"), r.item_label);
  html += detailRow(t("form_name"), r.name);
  html += detailRow(t("form_contact"), r.phone);
  html += detailRow(t("form_street"), r.street || t("not_specified"));
  html += detailRow(t("form_area"), r.area || t("not_specified"));
  if(r.notes) html += detailRow(t("form_note"), r.notes);
  html += detailRow(t("detail_added_on"), fmtDate(r.created_at));
  document.getElementById("reservationDetailFields").innerHTML = html;

  const mapWrap = document.getElementById("reservationMapWrap");
  const mapsLink = document.getElementById("reservationMapsLink");
  if(r.lat != null && r.lng != null){
    mapWrap.style.display = "block";
    mapsLink.style.display = "flex";
    mapsLink.href = "https://www.google.com/maps?q=" + r.lat + "," + r.lng;
    requestAnimationFrame(()=>{
      if(!reservationDetailMap){
        reservationDetailMap = L.map("reservationDetailMap", { zoomControl:false, dragging:false, scrollWheelZoom:false }).setView([r.lat, r.lng], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution:"&copy; OpenStreetMap contributors", maxZoom:19 }).addTo(reservationDetailMap);
        reservationDetailMarker = L.marker([r.lat, r.lng]).addTo(reservationDetailMap);
      }else{
        reservationDetailMap.setView([r.lat, r.lng], 15);
        reservationDetailMarker.setLatLng([r.lat, r.lng]);
      }
      setTimeout(()=> reservationDetailMap.invalidateSize(), 60);
    });
  }else{
    mapWrap.style.display = "none";
    mapsLink.style.display = "none";
  }

  document.getElementById("reservationFulfillBtn").style.display = r.status==="fulfilled" ? "none" : "flex";
  openModal("reservationDetailModal");
}

document.getElementById("reservationFulfillBtn").addEventListener("click", async ()=>{
  if(!currentReservationId) return;
  try{
    await adminCall("admin_update_reservation_status", { p_id: currentReservationId, p_status: "fulfilled" });
    const r = cachedReservations.find(x=> x.id===currentReservationId);
    if(r) r.status = "fulfilled";
    renderReservationsCached();
    updateReservationsBadge();
    closeModal("reservationDetailModal");
    showToast(t("reservation_fulfilled_toast"));
  }catch(err){
    showToast(friendlyError(err), true);
  }
});

document.getElementById("reservationDeleteBtn").addEventListener("click", async ()=>{
  if(!currentReservationId) return;
  if(!confirm(t("confirm_delete"))) return;
  try{
    await adminCall("admin_delete_reservation", { p_id: currentReservationId });
    cachedReservations = cachedReservations.filter(x=> x.id !== currentReservationId);
    renderReservationsCached();
    updateReservationsBadge();
    closeModal("reservationDetailModal");
    showToast(t("reservation_deleted_toast"));
  }catch(err){
    showToast(friendlyError(err), true);
  }
});

/* ---------- Site settings (About text + Donate phone) ---------- */
let cachedSettings = { about_text: null, donate_phone: null };

async function loadSettings(){
  const { data, error } = await supabase.from("site_settings").select("*");
  if(error){ showToast(friendlyError(error), true); return; }
  (data || []).forEach(row=> { cachedSettings[row.key] = row.value; });
  renderAboutView();
  renderDonatePhone();
}

function renderAboutView(){
  const text = cachedSettings.about_text || t("about_default_text");
  const html = text.split(/\n{2,}/).map(p=> "<p>"+escapeHTML(p)+"</p>").join("");
  const el = document.getElementById("aboutBodyText");
  if(el) el.innerHTML = html;
}
document.getElementById("aboutEditBtn").addEventListener("click", ()=>{
  document.getElementById("aboutTextarea").value = cachedSettings.about_text || t("about_default_text");
  document.getElementById("aboutView").style.display = "none";
  document.getElementById("aboutEditView").style.display = "block";
});
document.getElementById("aboutCancelBtn").addEventListener("click", ()=>{
  document.getElementById("aboutView").style.display = "block";
  document.getElementById("aboutEditView").style.display = "none";
});
document.getElementById("aboutSaveBtn").addEventListener("click", async ()=>{
  const val = document.getElementById("aboutTextarea").value;
  try{
    await adminCall("admin_set_setting", { p_key: "about_text", p_value: val });
    cachedSettings.about_text = val;
    renderAboutView();
    document.getElementById("aboutView").style.display = "block";
    document.getElementById("aboutEditView").style.display = "none";
    showToast(t("save_about_toast"));

});

/* ---------- Donate page: goods form + admin inbox ---------- */
document.getElementById("donateForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try{
    const { error } = await supabase.rpc("submit_donation", {
      p_name: document.getElementById("donateName").value.trim(),
      p_contact: document.getElementById("donateContact").value.trim(),
      p_item_desc: document.getElementById("donateItemDesc").value.trim(),
      p_quantity: document.getElementById("donateQuantity").value.trim() || null,
      p_note: document.getElementById("donateNote").value.trim() || null
    });
    if(error) throw error;
    e.target.reset();
    showToast(t("donate_thanks_toast"));
    if(isAdmin()) loadInbox();
  }catch(err){
    showToast(friendlyError(err), true);
  }finally{
    btn.disabled = false;
  }
});

let cachedInbox = [];
async function loadInbox(){
  if(!isAdmin()) return;
  try{
    cachedInbox = await adminCall("admin_list_donations", {});
    renderInboxCached();
  }catch(err){
    showToast(friendlyError(err), true);
  }
}
function renderInboxCached(){
  if(!isAdmin()) return;
  const list = document.getElementById("inboxList");
  const empty = document.getElementById("inboxEmpty");
  if(!list) return;
  list.innerHTML = "";
  if(!cachedInbox.length){ empty.style.display = "block"; return; }
  empty.style.display = "none";
  cachedInbox.forEach(entry=>{
    const card = document.createElement("div");
    card.className = "inbox-item" + (entry.reviewed ? " reviewed" : "");
    card.innerHTML =
      '<div class="inbox-item-top"><span class="name">'+escapeHTML(entry.name || "—")+
        (entry.reviewed ? ' <span class="badge badge-green">'+escapeHTML(t("inbox_reviewed_badge"))+'</span>' : '') +
      '</span><span class="date">'+fmtDate(entry.created_at)+'</span></div>' +
      '<p><span class="lbl">'+escapeHTML(t("form_contact"))+': </span>'+escapeHTML(entry.contact || "—")+'</p>' +
      '<p><span class="lbl">'+escapeHTML(t("form_item_desc"))+': </span>'+escapeHTML(entry.item_desc || "—")+'</p>' +
      (entry.quantity ? '<p><span class="lbl">'+escapeHTML(t("form_quantity"))+': </span>'+escapeHTML(entry.quantity)+'</p>' : '') +
      (entry.note ? '<p><span class="lbl">'+escapeHTML(t("form_note"))+': </span>'+escapeHTML(entry.note)+'</p>' : '') +
      '<div class="inbox-actions">' +
        (entry.reviewed ? '' : '<button class="btn btn-outline btn-sm" data-act="review" data-id="'+entry.id+'">'+escapeHTML(t("inbox_mark_reviewed"))+'</button>') +
        '<button class="btn btn-danger btn-sm" data-act="delete" data-id="'+entry.id+'">'+escapeHTML(t("inbox_delete"))+'</button>' +
      '</div>';
    list.appendChild(card);
  });
  list.querySelectorAll('[data-act="review"]').forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        await adminCall("admin_mark_donation_reviewed", { p_id: btn.getAttribute("data-id") });
        const e = cachedInbox.find(x=> x.id === btn.getAttribute("data-id"));
        if(e) e.reviewed = true;
        renderInboxCached();
      }catch(err){ showToast(friendlyError(err), true); }
    });
  });
  list.querySelectorAll('[data-act="delete"]').forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm(t("confirm_delete"))) return;
      try{
        await adminCall("admin_delete_donation", { p_id: btn.getAttribute("data-id") });
        cachedInbox = cachedInbox.filter(x=> x.id !== btn.getAttribute("data-id"));
        renderInboxCached();
      }catch(err){ showToast(friendlyError(err), true); }
    });
  });
}

document.querySelectorAll(".lang-option").forEach(opt=>{
  opt.addEventListener("click", ()=>{
    applyLanguage(opt.getAttribute("data-lang"));
    showToast(t("settings_saved_toast"));
  });
});

/* ---------- Init ---------- */
async function init(){
  applyLanguage(currentLang);
  updateAdminUI();

  await Promise.all([ loadSettings(), loadClothes(), loadExtra() ]);

  if(isAdmin()){
    loadInbox();
    loadReservations();
  }

  const hash = location.hash.replace("#", "");
  const validPages = ["home","clothes","extra","about","donate","settings","login","reservations"];
  showPage(validPages.includes(hash) ? hash : "home");
}
init();
</script>
</body>
</html>
